name: dosebuddy
description: A medication tracking and reminder app (iOS)
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # UI & Design
  flutter_svg: ^2.0.9           # Pill bottle assets
  table_calendar: ^3.0.9        # Calendar widget
  intl: ^0.18.1                 # Date formatting
  fl_chart: ^0.66.0             # Legacy chart dependency
  
  # Notifications (permissions requested explicitly)
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  
  # Media & Sharing
  image_picker: ^1.0.7          # Camera/gallery
  google_mlkit_text_recognition: ^0.16.0  # On-device prescription label OCR
  share_plus: ^7.2.1            # Share medication data
  
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  flutter_timezone: 4.1.1
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

  # Icons
  cupertino_icons: ^1.0.2       # iOS-style icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  # Assets - Pill bottle logos
  assets:
    - assets/images/pill_bottle_logo.svg
    - assets/images/pill_bottle_icon.svg
    - assets/images/pill_bottle_app_icon.svg
