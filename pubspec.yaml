name: dosebuddy
description: A medication tracking and reminder app (iOS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # UI & Design
  flutter_svg: ^2.0.9           # For pill bottle logos ✅
  table_calendar: ^3.0.9        # Calendar widget
  intl: ^0.18.1                 # Date formatting
  fl_chart: ^0.66.0             # Charts and graphs ✅ FIXES insights_page.dart
  
  # Notifications (iOS handles permissions automatically)
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  
  # Media & Sharing
  image_picker: ^1.0.7          # Camera/gallery ✅ FIXES profile_page.dart (ImageSource)
  share_plus: ^7.2.1            # Share medication data
  
  # Icons
  cupertino_icons: ^1.0.2       # iOS-style icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  # Assets - Pill bottle logos
  assets:
    - assets/images/pill_bottle_logo.svg
    - assets/images/pill_bottle_icon.svg
    - assets/images/pill_bottle_app_icon.svg