name: Care Circle backend checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  shared-care:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npx firebase emulators:exec --only firestore --project demo-dosebuddy-care 'npm run test:emulator'
        working-directory: functions
