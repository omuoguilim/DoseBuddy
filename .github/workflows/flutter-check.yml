name: Flutter checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # The original app has existing lint warnings; fail on errors while those are resolved.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Rebuild CocoaPods integration from a clean checkout
        run: |
          cd ios
          pod deintegrate
      - name: Build iOS simulator
        run: |
          if flutter build ios --simulator --debug --no-codesign --verbose > native-build.log 2>&1; then
            tail -n 20 native-build.log
          else
            rg -n -C 3 "error:|Error \(Xcode\)|ld:|Pods_Runner|Linker command" native-build.log | tail -n 180
            exit 1
          fi
      - name: Package simulator app with executable permissions
        run: tar -czf dosebuddy-ios-simulator.tar.gz -C build/ios/iphonesimulator Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: dosebuddy-ios-simulator
          path: dosebuddy-ios-simulator.tar.gz
  android-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: dosebuddy-android-demo
          path: build/app/outputs/flutter-apk/app-debug.apk
