<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B67CA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B8CE8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B8CE8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8A5E8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bottle body -->
  <rect x="30" y="30" width="40" height="55" rx="4" fill="url(#bottleGrad)"/>
  
  <!-- Bottle cap -->
  <rect x="35" y="20" width="30" height="12" rx="3" fill="url(#capGrad)"/>
  <rect x="37.5" y="17" width="25" height="5" rx="2.5" fill="url(#capGrad)"/>
  
  <!-- Label -->
  <rect x="35" y="45" width="30" height="20" rx="2" fill="#ffffff" opacity="0.3"/>
  
  <!-- Cross symbol -->
  <rect x="47.5" y="51.5" width="2" height="7" rx="1" fill="#ffffff"/>
  <rect x="44" y="54.5" width="9" height="2" rx="1" fill="#ffffff"/>
  
  <!-- Pills inside -->
  <circle cx="42" cy="65" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="52" cy="68" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="58" cy="63" r="4" fill="#ffffff" opacity="0.6"/>
  
  <!-- Shine -->
  <rect x="60" y="33" width="6" height="30" rx="3" fill="#ffffff" opacity="0.2"/>
</svg>