<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="bottleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B67CA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B8CE8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B8CE8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8A5E8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="labelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Bottle body -->
  <rect x="60" y="60" width="80" height="110" rx="8" fill="url(#bottleGradient)"/>
  
  <!-- Bottle cap -->
  <rect x="70" y="40" width="60" height="25" rx="6" fill="url(#capGradient)"/>
  <rect x="75" y="35" width="50" height="10" rx="5" fill="url(#capGradient)"/>
  
  <!-- Label on bottle -->
  <rect x="70" y="90" width="60" height="40" rx="4" fill="url(#labelGradient)" opacity="0.3"/>
  
  <!-- Pills inside (visible through translucent bottle) -->
  <circle cx="85" cy="130" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="105" cy="135" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="115" cy="125" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="95" cy="145" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="110" cy="150" r="8" fill="#ffffff" opacity="0.6"/>
  
  <!-- Cross symbol on label -->
  <rect x="95" y="103" width="3" height="14" rx="1.5" fill="#5B67CA"/>
  <rect x="88.5" y="109.5" width="16" height="3" rx="1.5" fill="#5B67CA"/>
  
  <!-- Shine effect -->
  <rect x="120" y="65" width="12" height="60" rx="6" fill="#ffffff" opacity="0.2"/>
  
  <!-- Shadow -->
  <ellipse cx="100" cy="175" rx="35" ry="5" fill="#000000" opacity="0.1"/>
</svg>