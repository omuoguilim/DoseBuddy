<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B67CA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B8CE8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottleGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B67CA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#9B8CE8;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Circular background -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="40" cy="40" r="30" fill="#ffffff" opacity="0.1"/>
  <circle cx="170" cy="160" r="40" fill="#ffffff" opacity="0.08"/>
  
  <!-- Bottle body (white on gradient background) -->
  <rect x="70" y="70" width="60" height="85" rx="6" fill="url(#bottleGradient2)"/>
  
  <!-- Bottle cap -->
  <rect x="77" y="53" width="46" height="20" rx="5" fill="url(#capGradient2)"/>
  <rect x="80" y="48" width="40" height="8" rx="4" fill="url(#capGradient2)"/>
  
  <!-- Label on bottle -->
  <rect x="77" y="95" width="46" height="32" rx="3" fill="#5B67CA" opacity="0.15"/>
  
  <!-- Pills inside -->
  <circle cx="88" cy="125" r="6" fill="#5B67CA" opacity="0.4"/>
  <circle cx="103" cy="130" r="6" fill="#5B67CA" opacity="0.4"/>
  <circle cx="112" cy="120" r="6" fill="#5B67CA" opacity="0.4"/>
  <circle cx="95" cy="138" r="6" fill="#5B67CA" opacity="0.4"/>
  <circle cx="108" cy="143" r="6" fill="#5B67CA" opacity="0.4"/>
  
  <!-- Medical cross on label -->
  <rect x="97" y="105" width="3" height="12" rx="1.5" fill="#5B67CA"/>
  <rect x="91.5" y="110.5" width="12" height="3" rx="1.5" fill="#5B67CA"/>
  
  <!-- Shine effect on bottle -->
  <rect x="112" y="75" width="10" height="50" rx="5" fill="#ffffff" opacity="0.3"/>
  
  <!-- Plus icon decoration in background -->
  <rect x="150" y="50" width="3" height="15" rx="1.5" fill="#ffffff" opacity="0.2"/>
  <rect x="144" y="56" width="15" height="3" rx="1.5" fill="#ffffff" opacity="0.2"/>
  
  <rect x="35" y="145" width="2" height="10" rx="1" fill="#ffffff" opacity="0.2"/>
  <rect x="30" y="149" width="10" height="2" rx="1" fill="#ffffff" opacity="0.2"/>
</svg>